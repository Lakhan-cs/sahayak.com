<main class="page">
  <p class="eyebrow">RESOURCE ALLOCATION</p><h1>Worker Recommendation</h1>
  <div class="filters">
    <label>Area<select id="workerArea"></select></label>
    <label>Service<select id="workerService"></select></label>
    <button id="recommendBtn">Recommend Workers</button>
  </div>
  <div class="stats-grid compact">
    <div class="stat-card"><span>7-day demand</span><strong id="workerForecast">–</strong></div>
    <div class="stat-card"><span>Workers required</span><strong id="workerRequired">–</strong></div>
    <div class="stat-card"><span>Available now</span><strong id="workerAvailable">–</strong></div>
    <div class="stat-card"><span>Capacity gap</span><strong id="workerGap">–</strong></div>
  </div>
  <section class="panel"><h2>Ranked providers</h2><div id="recommendations" class="table-wrap">Select an area and service.</div></section>
