<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Demand Forecast</title>
    <link rel="stylesheet" href="./static/style.css" />
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  </head>
  <body>
    <nav class="sidebar">
      <div class="brand">Sahayak</div>
      <a href="./homepage.html">Home</a>
      <a href="./dashboard.html">Dashboard</a>
      <a href="./analysis.html">Demand Forecast</a>
      <a href="./service_forecast.html">Service Forecast</a>
      <a href="./area_stats.html">Location Forecast</a>
      <!-- <a href="./worker_recommendations.html">Worker Recommendation</a> -->
      <!-- <a href="./dashboard.html">Analytics</a> -->
    </nav>

    <main class="page">
      <p class="eyebrow">FORECASTING</p>
      <h1>Area + Service Demand Forecast</h1>
      <div class="filters">
        <label>Area<select id="area"></select></label>
        <label>Service<select id="service"></select></label>
        <button id="forecastBtn">Generate Forecast</button>
      </div>
      <div class="stats-grid compact">
        <div class="stat-card">
          <span>7-day demand</span><strong id="totalForecast">–</strong>
        </div>
        <div class="stat-card">
          <span>Available now</span
          ><strong id="current_available_workers">–</strong>
        </div>
        <div class="stat-card">
          <span>Workers required</span><strong id="required_Workers">–</strong>
        </div>
        <div class="stat-card">
          <span>Capacity gap</span><strong id="capacity_Gap">–</strong>
        </div>
      </div>
      <section class="panel chart-panel">
        <div class="panel-title">
          <div>
            <h2>Next 7 days</h2>
            <p id="forecastStatus" class="muted"></p>
          </div>
          <span id="modelBadge" class="badge">–</span>
        </div>
        <canvas id="forecastChart"></canvas>
      </section>
      <!-- <section class="panel"><h2>Features used</h2><p id="featureList" class="feature-list">–</p></section> -->
    </main>
    <script src="./static/analysis.js"></script>
  </body>
</html>
