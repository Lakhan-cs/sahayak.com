<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Log in — Sahayak</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;0,9..144,700;0,9..144,800;1,9..144,500;1,9..144,600&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="homepage.css" />
    <link rel="stylesheet" href="auth.css" />
    <script src="https://accounts.google.com/gsi/client" async defer></script>
  </head>
  <body>
    <div class="auth-nav">
      <a class="brand" href="homepage.html"
        ><span class="brand-mark"></span>Sahayak</a
      >
      <a class="auth-back" href="homepage.html">
        <svg
          width="15"
          height="15"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2.4"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <path d="M19 12H5M11 18l-6-6 6-6" />
        </svg>
        Back to home
      </a>
    </div>

    <div class="auth-shell">
      <div class="auth-brand">
        <div class="auth-brand-top">
          <div class="brand"><span class="brand-mark"></span>Sahayak</div>
          <p class="auth-quote">
            Welcome back to <em>your community</em> of trusted local pros.
          </p>

          <div class="auth-cards">
            <div
              class="auth-mini-card auth-mini-a"
              style="
                background-image:
                  linear-gradient(
                    180deg,
                    rgba(27, 18, 48, 0.05) 40%,
                    rgba(27, 18, 48, 0.8) 100%
                  ),
                  url(&quot;https://images.unsplash.com/photo-1581578731548-c64695cc6952?w=400&h=320&fit=crop&quot;);
              "
            >
              <span>Home cleaning</span>
            </div>
            <div
              class="auth-mini-card auth-mini-b"
              style="
                background-image:
                  linear-gradient(
                    180deg,
                    rgba(27, 18, 48, 0.02) 40%,
                    rgba(27, 18, 48, 0.7) 100%
                  ),
                  url(&quot;https://images.unsplash.com/photo-1621905251189-08b45d6a269e?w=400&h=320&fit=crop&quot;);
              "
            >
              <span>Electrical work</span>
            </div>
            <div
              class="auth-mini-card auth-mini-c"
              style="
                background-image:
                  linear-gradient(
                    180deg,
                    rgba(27, 18, 48, 0.05) 40%,
                    rgba(27, 18, 48, 0.8) 100%
                  ),
                  url(&quot;https://images.unsplash.com/photo-1416879595882-3373a0480b5b?w=400&h=320&fit=crop&quot;);
              "
            >
              <span>Gardening</span>
            </div>
          </div>
        </div>

        <div class="auth-stats">
          <div><strong>500,000+</strong><span>homes that trust us</span></div>
          <div><strong>10,000+</strong><span>professional workers</span></div>
        </div>
      </div>

      <div class="auth-form-panel">
        <div class="auth-form-card">
          <span class="eyebrow">Log in</span>
          <h1>Good to see you again.</h1>
          <p>New to Sahayak? <a href="signup.html">Create an account</a></p>

          <form id="loginForm">
            <div class="field">
              <label for="email">Email address</label>
              <div class="field-input">
                <svg
                  width="17"
                  height="17"
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                >
                  <rect x="2" y="4" width="20" height="16" rx="2" />
                  <path d="m2 7 10 6 10-6" />
                </svg>
                <input
                  type="email"
                  id="email"
                  placeholder="you@example.com"
                  required
                />
              </div>
            </div>

            <div class="field">
              <label for="password">Password</label>
              <div class="field-input">
                <svg
                  width="17"
                  height="17"
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                >
                  <rect x="4" y="10" width="16" height="10" rx="2" />
                  <path d="M8 10V7a4 4 0 0 1 8 0v3" />
                </svg>
                <input
                  type="password"
                  id="password"
                  placeholder="Enter your password"
                  required
                />
                <button
                  type="button"
                  class="pw-toggle"
                  aria-label="Show password"
                >
                  <svg
                    width="18"
                    height="18"
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="2"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                  >
                    <path
                      d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7Z"
                    />
                    <circle cx="12" cy="12" r="3" />
                  </svg>
                </button>
              </div>
            </div>

            <div class="field-row">
              <label class="checkbox"
                ><input type="checkbox" /> Remember me</label
              >
              <a class="forgot-link" href="forgotpass.html">Forgot password?</a>
            </div>

            <button type="submit" class="btn btn-primary btn-block">
              Log in
            </button>
          </form>

          <div class="divider">or continue with</div>
          <div class="social-row">
            <button class="social-btn google-btn" type="button">
              <svg width="17" height="17" viewBox="0 0 24 24">
                <path
                  fill="#EA4335"
                  d="M12 10.2v3.9h5.5c-.24 1.4-1.7 4.1-5.5 4.1-3.3 0-6-2.7-6-6.1s2.7-6.1 6-6.1c1.9 0 3.1.8 3.8 1.5l2.6-2.5C16.7 3.3 14.6 2.3 12 2.3 6.9 2.3 2.8 6.5 2.8 11.6s4.1 9.3 9.2 9.3c5.3 0 8.8-3.7 8.8-9 0-.6-.06-1-.14-1.5z"
                />
              </svg>
              Google
            </button>
            <button class="social-btn" type="button">
              <svg
                width="16"
                height="16"
                viewBox="0 0 24 24"
                fill="currentColor"
              >
                <path
                  d="M16.7 1c.13 1.06-.32 2.13-.98 2.9-.68.8-1.8 1.42-2.9 1.33-.15-1.02.36-2.1 1-2.83.72-.82 1.94-1.44 2.88-1.4zM20.7 17.2c-.5 1.14-.74 1.65-1.38 2.65-.9 1.4-2.16 3.14-3.73 3.15-1.4.02-1.76-.9-3.65-.9-1.9 0-2.3.88-3.68.92-1.5.05-2.65-1.5-3.55-2.9-1.94-2.98-2.44-6.87-1.08-9.87.72-1.6 2.1-2.85 3.9-2.87 1.4-.03 2.7.94 3.65.94.94 0 2.55-1.16 4.3-.99.73.03 2.8.3 4.13 2.24-1.06.66-1.78 1.85-1.8 3.13-.02 1.6.98 2.6 1.9 3.4z"
                />
              </svg>
              Apple
            </button>
          </div>
        </div>
      </div>
    </div>

    <script src="auth.js"></script>
  </body>
</html>
